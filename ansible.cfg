[defaults]
inventory = inventory/inventory
roles_path = roles/
forks = 5
timeout = 30
nocows = 1
retry_files_enabled = False
gathering = smart
# Cloud VMs are recreated constantly, so their host keys churn.
host_key_checking = False
# Silences the interpreter discovery warning; Ubuntu 24.04+ ships python3.
interpreter_python = auto_silent
# The community.general.yaml callback was removed in community.general 12;
# this is the built-in replacement.
result_format = yaml
callbacks_enabled = profile_tasks

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=30m -o ConnectionAttempts=100 -o UserKnownHostsFile=/dev/null
